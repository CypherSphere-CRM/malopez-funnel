<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CRM pilot test</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><style>body{background:#081522;color:white;font:16px system-ui;margin:0}main{max-width:480px;margin:40px auto;padding:24px}button{background:#2699d6;color:white;border:0;border-radius:8px;padding:14px;width:100%;font:inherit}button:disabled{opacity:.5}p{line-height:1.5}</style></head><body><main><h1>CRM lead capture test</h1><p>Internal pilot only. Sends one fictional contact to Miguel's CRM. Do not enter real customer information.</p><p>Test Lead · test@example.com · 202-555-0100</p><form id="test"><div class="cf-turnstile" data-sitekey="0x4AAAAAAGU1zB8qQRCJcb9h" data-action="realty_lead"></div><button id="send">Send test lead</button></form><p id="status" role="status"></p></main><script>const form=document.getElementById('test'),status=document.getElementById('status'),button=document.getElementById('send');form.addEventListener('submit',async e=>{e.preventDefault();const token=new FormData(form).get('cf-turnstile-response');if(!token){status.textContent='Complete verification first.';return}button.disabled=true;status.textContent='Sending test lead…';try{const r=await fetch('https://crm.cyphersphereconsulting.com/api/malopez-lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'CRM Pilot Test Lead',email:'test@example.com',phone:'202-555-0100',notes:'Fictional test contact — safe to delete.',turnstileToken:token})});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.ok)throw new Error('Unexpected response');status.textContent='Test lead saved. Open Miguel’s CRM to verify.';return}catch(e){status.textContent='Test failed: '+e.message;button.disabled=false;if(window.turnstile)turnstile.reset()}});</script></body></html>
