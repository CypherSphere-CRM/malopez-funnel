<!DOCTYPE html>
<html>
<head>
  <title>Find Homes | Malopez Realty</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f8fafc;
    }

    .lang {
      text-align: right;
      padding: 10px;
    }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url('https://images.unsplash.com/photo-1572120360610-d971b9d7767c') center/cover;
      color: white;
      padding: 80px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    .hero p {
      font-size: 18px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.7);
    }

    .section {
      padding: 40px 20px;
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
      margin: 10px 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    input, textarea {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #115e59;
    }

    .disclaimer {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<!-- LANGUAGE -->
<div class="lang">
  <button onclick="setLang('en')">EN</button>
  <button onclick="setLang('es')">ES</button>
</div>

<!-- HERO -->
<div class="hero">
  <h1 id="title">🏡 Get Access to Available Homes in Your Area</h1>
  <p id="subtitle">See listings + schedule a private showing ✨</p>
</div>

<!-- GALLERY -->
<div class="section">
  <h2 id="galleryTitle">Homes You Could Explore</h2>
  <p id="gallerySub">Photos are examples of homes you may see ✨</p>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1572120360610-d971b9d7767c">
    <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae">
    <img src="https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde">
  </div>

  <p class="disclaimer">
    Images are for inspiration purposes and may not represent the exact property.
  </p>
</div>

<!-- FORM -->
<div class="section">
  <div class="card">

    <h3 id="formTitle">Find Homes Near You</h3>

    <form action="https://formspree.io/f/xkopdpgo" method="POST">

      <input name="name" placeholder="Your Name" required id="nameInput">

      <input name="email" type="email" placeholder="Your Email" required id="emailInput">

      <input name="phone" placeholder="Phone Number" id="phoneInput">

      <textarea name="message" placeholder="Any questions or details you'd like to share?" id="messageInput"></textarea>

      <input type="hidden" name="business" value="Malopez Realty">

      <button type="submit" id="submitBtn">See Available Homes</button>

    </form>

  </div>
</div>

<!-- SCRIPT -->
<script>
function setLang(lang) {

  if (lang === 'es') {
    document.getElementById("title").innerText = "🏡 Accede a Casas Disponibles en Tu Área";
    document.getElementById("subtitle").innerText = "Ver propiedades y agendar una visita ✨";
    document.getElementById("galleryTitle").innerText = "Casas que Podrías Explorar";
    document.getElementById("gallerySub").innerText = "Fotos de ejemplo de propiedades disponibles";
    document.getElementById("formTitle").innerText = "Encuentra Casas Cerca de Ti";
    document.getElementById("nameInput").placeholder = "Tu Nombre";
    document.getElementById("emailInput").placeholder = "Tu Correo Electrónico";
    document.getElementById("phoneInput").placeholder = "Número de Teléfono";
    document.getElementById("messageInput").placeholder = "¿Tienes preguntas o buscas algo específico?";
    document.getElementById("submitBtn").innerText = "Ver Casas Disponibles";
  }

  if (lang === 'en') {
    document.getElementById("title").innerText = "🏡 Get Access to Available Homes in Your Area";
    document.getElementById("subtitle").innerText = "See listings + schedule a private showing ✨";
    document.getElementById("galleryTitle").innerText = "Homes You Could Explore";
    document.getElementById("gallerySub").innerText = "Photos are examples of homes you may see ✨";
    document.getElementById("formTitle").innerText = "Find Homes Near You";
    document.getElementById("nameInput").placeholder = "Your Name";
    document.getElementById("emailInput").placeholder = "Your Email";
    document.getElementById("phoneInput").placeholder = "Phone Number";
    document.getElementById("messageInput").placeholder = "Any questions or details you'd like to share?";
    document.getElementById("submitBtn").innerText = "See Available Homes";
  }

}
</script>

</body>
</html>
