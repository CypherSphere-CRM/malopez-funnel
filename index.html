<!DOCTYPE html>
<html>
<head>
  <title>Malopez Realty | Find Your Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom, #0f172a, #334155);
      color: white;
    }

    .lang {
      text-align: right;
      padding: 15px;
    }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));
      padding: 80px 20px;
      text-align: center;
    }

    .logo {
      width: 200px;
      margin-bottom: 15px;
    }

    .agent-img {
      width: 180px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .agent {
      font-size: 16px;
      color: #cbd5f5;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #e2e8f0;
    }

    .cta-buttons button {
      margin: 8px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .call-btn {
      background: #2563eb;
      color: white;
    }

    .text-btn {
      background: #14b8a6;
      color: white;
    }

    .section {
      padding: 50px 20px;
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      margin: 12px 0;
    }

    .card {
      background: rgba(255,255,255,0.95);
      color: #111;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    input, textarea {
      width: 95%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button.submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #0f766e, #14b8a6);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .note {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="hero">

  <!-- LOGO -->
  <img src="miguel.png" class="logo">

  <!-- AGENT IMAGE -->
  <img src="miguel.png" class="agent-img">

  <!-- AGENT INFO -->
  <div class="agent">
    Miguel Lopez • Trusted Local Realtor
  </div>

  <h1>🏡 Find Your Next Home With Confidence</h1>
  <p>Tell us what you're looking for and get homes that match your lifestyle ✨</p>

  <!-- CALL / TEXT -->
  <div class="cta-buttons">
    <a href="tel:4074480223">
      <button class="call-btn">📞 Call Miguel</button>
    </a>

    <a href="sms:4074480223">
      <button class="text-btn">💬 Text Miguel</button>
    </a>
  </div>

</div>

<!-- FORM -->
<div class="section">
  <div class="card">

    <h3>Tell Us What You're Looking For</h3>

    <form action="https://formspree.io/f/xkopdpgo" method="POST">

      <input name="name" placeholder="Your Name" required>
      <input name="email" type="email" placeholder="Your Email" required>
      <input name="phone" placeholder="Phone Number">

      <textarea name="message" placeholder="Price, area, bedrooms..."></textarea>

      <button type="submit" class="submit">Get Personalized Home Options</button>

      <p class="note">
        Takes 10 seconds • No pressure • We’ll reach out shortly
      </p>

    </form>

  </div>
</div>

</body>
</html>
