<!DOCTYPE html>
<html>
<head>
  <title>Malopez Realty | Find Your Home</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom, #0f172a, #334155);
      color: white;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero img {
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }

    .agent {
      font-size: 16px;
      color: #cbd5f5;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .cta-buttons button {
      margin: 8px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .call-btn {
      background: #2563eb;
      color: white;
    }

    .text-btn {
      background: #14b8a6;
      color: white;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
      max-width: 700px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      margin: 10px 0;
    }

    .card {
      background: rgba(255,255,255,0.95);
      color: black;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    input, textarea {
      width: 95%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    textarea {
      height: 100px;
    }

    button.submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #0f766e, #14b8a6);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .note {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
    }

    .disclaimer {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<!-- HERO -->
<div class="hero">

  <!-- YOUR IMAGE (LOGO + MIGUEL) -->
  <img src="hero.png">

  <div class="agent">
    Miguel Lopez • Trusted Local Realtor
  </div>

  <h1>🏡 Find Your Next Home With Confidence</h1>

  <!-- CALL / TEXT -->
  <div class="cta-buttons">
    <a href="tel:4074480223">
      <button class="call-btn">📞 Call Miguel</button>
    </a>

    <a href="sms:4074480223">
      <button class="text-btn">💬 Text Miguel</button>
    </a>
  </div>

</div>

<!-- HOUSES -->
<div class="section">
  <h2>Homes You Could Explore</h2>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1572120360610-d971b9d7767c">
    <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae">
    <img src="https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde">
  </div>

  <div class="disclaimer">
    Images are for inspiration purposes and may not represent actual listings.
  </div>
</div>

<!-- FORM -->
<div class="section">
  <div class="card">

    <h3>Tell Us What You're Looking For</h3>

    <form action="https://formspree.io/f/xkopdpgo" method="POST">

      <input name="name" placeholder="Your Name" required>
      <input name="email" type="email" placeholder="Your Email" required>
      <input name="phone" placeholder="Phone Number">

      <textarea name="message" placeholder="Tell us what you're looking for (price, area, bedrooms...)"></textarea>

      <button type="submit" class="submit">
        Get Personalized Home Options
      </button>

      <div class="note">
        Takes 10 seconds • No pressure • We’ll reach out shortly
      </div>

    </form>

  </div>
</div>

</body>
</html>
