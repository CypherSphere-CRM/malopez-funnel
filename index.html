<!DOCTYPE html>
<html>
<head>
  <title>Malopez Realty | Find Your Home</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom, #111827, #374151);
      color: white;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
      background: black;
    }

    .hero img {
      width: 100%;
      max-width: 350px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .agent {
      font-size: 15px;
      color: #cbd5f5;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .cta-buttons button {
      margin: 6px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .call-btn { background: #2563eb; color: white; }
    .text-btn { background: #14b8a6; color: white; }

    .section {
      padding: 40px 20px;
      text-align: center;
      max-width: 900px;
      margin: auto;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card-img {
      background: #1f2937;
      border-radius: 12px;
      overflow: hidden;
    }

    .card-img img {
      width: 100%;
      display: block;
    }

    .label {
      padding: 10px;
      font-size: 13px;
      background: #0f172a;
    }

    .sold { color: #22c55e; }
    .rented { color: #38bdf8; }
    .active { color: #f59e0b; }

    /* FORM */
    .form-box {
      background: white;
      color: black;
      padding: 25px;
      border-radius: 12px;
      margin-top: 30px;
    }

    input, textarea {
      width: 95%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button.submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #0f766e, #14b8a6);
      color: white;
      border: none;
      border-radius: 6px;
    }

    .note {
      font-size: 12px;
      color: #555;
    }

  </style>
</head>

<body>

<!-- HERO -->
<div class="hero">

  <img src="hero.png">

  <div class="agent">
    Miguel Lopez • Trusted Local Realtor
  </div>

  <h1>🏡 Find Your Next Home With Confidence</h1>

  <div class="cta-buttons">
    <a href="tel:4074480223">
      <button class="call-btn">📞 Call Miguel</button>
    </a>

    <a href="sms:4074480223">
      <button class="text-btn">💬 Text Miguel</button>
    </a>
  </div>

</div>

<!-- ⭐ FEATURED LISTING -->
<div class="section">
  <h2>🔥 Featured Listing</h2>

  <div class="card-img">
    <img src="active-listing.jpg">
    <div class="label active">
      ACTIVE • Available Now
    </div>
  </div>
</div>

<!-- 🏡 REAL HOMES -->
<div class="section">
  <h2>Homes Miguel Has Helped Clients Buy/Sell</h2>

  <div class="grid">

    <div class="card-img">
      <img src="home1.jpg">
      <div class="label sold">SOLD</div>
    </div>

    <div class="card-img">
      <img src="home2.jpg">
      <div class="label sold">SOLD</div>
    </div>

    <div class="card-img">
      <img src="rented-home.jpg">
      <div class="label rented">RENTED</div>
    </div>

  </div>
</div>

<!-- FORM -->
<div class="section">

  <div class="form-box">

    <h3>Tell Us What You're Looking For</h3>

    <form action="https://formspree.io/f/xkopdpgo" method="POST">

      <input name="name" placeholder="Your Name" required>
      <input name="email" type="email" placeholder="Your Email" required>
      <input name="phone" placeholder="Phone Number">

      <textarea name="message" placeholder="Price, area, bedrooms..."></textarea>

      <button type="submit" class="submit">
        Get Personalized Home Options
      </button>

      <div class="note">
        Takes 10 seconds • No pressure • We’ll reach out shortly
      </div>

    </form>

  </div>

</div>

</body>
</html>
