<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads Dashboard</title>

<style>
body {font-family:Arial;background:#0b0f14;color:white;margin:0;padding:20px;}
h1 {margin-bottom:20px;}

table {
width:100%;
border-collapse:collapse;
background:white;
color:black;
}

th, td {
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

th {background:#0f766e;color:white;}

tr:hover {background:#f5f5f5;}

.container {max-width:1200px;margin:auto;}
</style>
</head>

<body>

<div class="container">
<h1>📊 Leads Dashboard</h1>

<table id="leadsTable">
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Message</th>
<th>Date</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDvWYT31f1fox4-yh07sxp4obl4xcN_Ag",
authDomain: "cyphersphere-ai-crm.firebaseapp.com",
projectId: "cyphersphere-ai-crm",
storageBucket: "cyphersphere-ai-crm.firebasestorage.app",
messagingSenderId: "110172601531",
appId: "1:110172601531:web:3426418258e34b93467d9e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadLeads(){
const querySnapshot = await getDocs(collection(db, "contacts"));
const table = document.querySelector("#leadsTable tbody");

querySnapshot.forEach((doc)=>{
const data = doc.data();

table.innerHTML += `
<tr>
<td>${data.name || ''}</td>
<td>${data.phone || ''}</td>
<td>${data.email || ''}</td>
<td>${data.message || ''}</td>
<td>${data.created || ''}</td>
</tr>
`;
});
}

loadLeads();

</script>

</body>
</html>
